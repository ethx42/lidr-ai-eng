[project]
name = "lidr-ai-eng"
version = "0.1.0"
description = "CAG software estimator: meeting transcription to LLM-generated estimation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "anyio>=4.15.1",
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "jinja2>=3.1.6",
    "jiter>=0.17.0",
    "openai>=3.19.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false
required-version = ">=0.12.18,<0.13"

[tool.ruff]
line-length = 100
extend-exclude = ["openspec", ".openspec", ".claude", "docs"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101"]
"app/context/examples.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
strict = true
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fakeredis>=2.39",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
]
