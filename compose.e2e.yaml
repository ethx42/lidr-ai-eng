# Offline stack for the end-to-end tests: docker compose -f compose.yaml -f compose.e2e.yaml up --build --wait
# No LLM calls: the replay provider serves the recorded cassettes (synthesised streams otherwise).
services:
  ai-service:
    environment:
      LLM_PROVIDER: replay
      # An empty value is ignored and restores the default Anthropic fallback (real spend)
      LLM_FALLBACKS: none
      # Empty is ignored, so no cache (NullCache): repeated sends of a sample keep streaming
      REDIS_URL: ""
    volumes:
      - ./tests/cassettes:/app/tests/cassettes:ro
