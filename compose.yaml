# Production-like stack (make up). Only web publishes a port, on loopback (the app has no auth and the
# BFF spends the AI service's keys, so it stays off the LAN); the AI service and Redis are reachable
# only on the Compose network. API keys reach only the AI service, from .env through env_file: never
# interpolate them here (${...}), or a key exported in the host shell would leak in.
# tests/test_compose.py enforces these rules.
services:
  web:
    build: { context: ./web, target: runtime }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      AI_SERVICE_URL: "http://ai-service:8000"
    depends_on:
      ai-service: { condition: service_healthy, restart: true }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 1s

  ai-service:
    build: { context: ., target: runtime }
    env_file: [{ path: .env, required: false }]
    environment:
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 1s
    # Longer than uvicorn's --timeout-graceful-shutdown 30, so open streams can drain on stop
    stop_grace_period: 35s

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
